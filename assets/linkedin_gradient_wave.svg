<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="LinkedIn"
     preserveAspectRatio="xMidYMid meet">
  <title>LinkedIn</title>
  <defs>
    <!--
      Gradient Wave replication of HTML row 04:
        • Element is 280×80 (200% of 140×40 button, i.e. inset:-50%)
        • Positioned at x=-70, y=-20
        • Stripe: transparent 37% → brand@32% 48% → transparent 59%
        • Starts translateX(-126) → ends translateX(+126)  [±45% of 280]
        • skewX(-25) approximates linear-gradient(115deg)
    -->
    <linearGradient id="liWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset=".37"  stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset=".48"  stop-color="#0A66C2" stop-opacity=".32"/>
      <stop offset=".59"  stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A66C2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="liClip">
      <rect x=".5" y=".5" width="139" height="39" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .bg   { fill:#f4f7fa; stroke:#ccd6e1; stroke-width:1; }
    .lbl  { fill:#1d2733; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:12px; font-weight:700; }
    .ico  { fill:#0A66C2; }
    .btn  { animation:softPulse 3.4s ease-in-out infinite; }

    @media (prefers-color-scheme:dark) {
      .bg  { fill:#27323d; stroke:#526171; }
      .lbl { fill:#e9eef3; }
      .ico { fill:#4aa3ff; }
    }

    /* ── Row-04 exact match: diagonal stripe sweeps L→R ── */
    .waveGrp {
      animation: gradWave 2.4s linear infinite;
    }
    @keyframes gradWave {
      from { transform: translateX(-126px); }
      to   { transform: translateX(126px);  }
    }

      to   { transform: translateX(280px);  }
    }

    /* Soft scale pulse on whole button */
    @keyframes softPulse {
      0%,100% { transform:scale(1); }
      50%     { transform:scale(1.007); }
    }

    @media (prefers-reduced-motion:reduce) {
    }
  </style>

  <g class="btn">
    <!-- Button background -->
    <rect class="bg" x=".5" y=".5" width="139" height="39" rx="7"/>

    <!-- ── Gradient Wave (identical to HTML row 04) ── -->
    <g clip-path="url(#liClip)">
      <!-- 280×80 element at (-70,-20), skewed at -25° ≈ 115deg gradient, sweeps ±126px -->
      <g class="waveGrp">
        <rect x="-70" y="-20" width="280" height="80"
              fill="url(#liWave)" transform="skewX(-25)"/>
      </g>
    </g>

    <!-- LinkedIn icon: 20×20 at x=12, y=10 -->
    <g transform="translate(12,10)">
      <path class="ico" d="M2.16 1.45a2.24 2.24 0 1 1 0 4.5 2.24 2.24 0 0 1 0-4.5ZM.2 8.15H4V18H.2V8.15ZM6.2 8.15h3.82v1.25h.07c.58-1 1.83-1.66 3.4-1.66 3.65 0 4.32 2.4 4.32 5.5V18h-3.98v-3.74c0-.9 0-3.07-1.9-3.07-1.93 0-2.23 1.5-2.23 2.99V18H6.2V8.15Z"/>
    </g>

    <!-- Label: x = 12(pad) + 20(icon) + 7(gap) = 39 -->
    <text class="lbl" x="39" y="25">LinkedIn</text>
  </g>
</svg>
