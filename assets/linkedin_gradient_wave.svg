<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="LinkedIn"
     preserveAspectRatio="xMidYMid meet">
  <title>LinkedIn</title>
  <defs>
    <!--
      Sequential Gradient Wave (1 of 5 in sequence):
        • Order: LinkedIn (0%-20%) -> GitHub (20%-40%) -> LeetCode (40%-60%) -> Kaggle (60%-80%) -> Instagram (80%-100%)
        • Total cycle: 8s. Each wave sweeps for 1.6s and finishes right as the next begins. Zero gap/delay.
    -->
    <linearGradient id="liWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset=".37"  stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset=".48"  stop-color="#0A66C2" stop-opacity=".32"/>
      <stop offset=".59"  stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A66C2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="liClip">
      <rect x=".5" y=".5" width="139" height="39" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .bg   { fill:#f4f7fa; stroke:#ccd6e1; stroke-width:1; }
    .lbl  { fill:#1d2733; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:12px; font-weight:700; }
    .ico  { fill:#0A66C2; }

    @media (prefers-color-scheme:dark) {
      .bg  { fill:#27323d; stroke:#526171; }
      .lbl { fill:#e9eef3; }
      .ico { fill:#4aa3ff; }
    }

    /* ── 1 of 5: Active 0% to 20% (0s to 1.6s) ── */
    .waveGrp {
      animation: gradWave 8s linear infinite;
    }
    @keyframes gradWave {
      0% {
        transform: translateX(-130px);
        opacity: 1;
      }
      20% {
        transform: translateX(130px);
        opacity: 1;
      }
      20.001% {
        transform: translateX(-130px);
        opacity: 0;
      }
      100% {
        transform: translateX(-130px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .waveGrp { animation: none; }
    }
  </style>

  <g class="btn">
    <!-- Button background -->
    <rect class="bg" x=".5" y=".5" width="139" height="39" rx="7"/>

    <!-- Gradient Wave -->
    <g clip-path="url(#liClip)">
      <g class="waveGrp">
        <rect x="-70" y="-20" width="280" height="80"
              fill="url(#liWave)" transform="skewX(-25)"/>
      </g>
    </g>

    <!-- LinkedIn icon: 20×20 at x=12, y=10 -->
    <g transform="translate(12,10)">
      <path class="ico" d="M2.16 1.45a2.24 2.24 0 1 1 0 4.5 2.24 2.24 0 0 1 0-4.5ZM.2 8.15H4V18H.2V8.15ZM6.2 8.15h3.82v1.25h.07c.58-1 1.83-1.66 3.4-1.66 3.65 0 4.32 2.4 4.32 5.5V18h-3.98v-3.74c0-.9 0-3.07-1.9-3.07-1.93 0-2.23 1.5-2.23 2.99V18H6.2V8.15Z"/>
    </g>

    <!-- Label: x = 12(pad) + 20(icon) + 7(gap) = 39 -->
    <text class="lbl" x="39" y="25">LinkedIn</text>
  </g>
</svg>
