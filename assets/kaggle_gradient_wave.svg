<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="Kaggle"
     preserveAspectRatio="xMidYMid meet">
  <title>Kaggle</title>
  <defs>
    <linearGradient id="kgWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#20BEFF" stop-opacity="0"/>
      <stop offset=".37"  stop-color="#20BEFF" stop-opacity="0"/>
      <stop offset=".48"  stop-color="#20BEFF" stop-opacity=".32"/>
      <stop offset=".59"  stop-color="#20BEFF" stop-opacity="0"/>
      <stop offset="1"    stop-color="#20BEFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="kgClip">
      <rect x=".5" y=".5" width="139" height="39" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .bg   { fill:#f4f7fa; stroke:#ccd6e1; stroke-width:1; }
    .lbl  { fill:#1d2733; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:12px; font-weight:700; }
    .ico  { fill:#20BEFF; }
    .btn  { animation:softPulse 3.4s ease-in-out infinite; }

    @media (prefers-color-scheme:dark) {
      .bg  { fill:#27323d; stroke:#526171; }
      .lbl { fill:#e9eef3; }
      .ico { fill:#45c8ff; }
    }

    .waveGrp { animation: gradWave 2.4s linear infinite; }
    @keyframes gradWave {
      from { transform: translateX(-126px); }
      to   { transform: translateX(126px);  }
    }
      to   { transform: translateX(280px);  }
    }

    @keyframes softPulse {
      0%,100% { transform:scale(1); }
      50%     { transform:scale(1.007); }
    }

    @media (prefers-reduced-motion:reduce) {
    }
  </style>

  <g class="btn">
    <rect class="bg" x=".5" y=".5" width="139" height="39" rx="7"/>

    <g clip-path="url(#kgClip)">
      <g class="waveGrp">
        <rect x="-70" y="-20" width="280" height="80"
              fill="url(#kgWave)" transform="skewX(-25)"/>
      </g>
    </g>

    <!-- Kaggle icon: 20×20 at x=12, y=10 -->
    <g transform="translate(12,10)">
      <path class="ico" d="M3.33 2.5h2.5v6.71l5.99-6.71H15L9.17 9.68 15.83 17.5h-3.2l-6.8-6.13V17.5H3.33V2.5Z"/>
    </g>

    <text class="lbl" x="39" y="25">Kaggle</text>
  </g>
</svg>
