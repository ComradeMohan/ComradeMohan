<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="GitHub"
     preserveAspectRatio="xMidYMid meet">
  <title>GitHub</title>
  <defs>
    <linearGradient id="ghWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset=".37"  stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset=".48"  stop-color="#2dd4bf" stop-opacity=".32"/>
      <stop offset=".59"  stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1"    stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ghClip">
      <rect x=".5" y=".5" width="139" height="39" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .bg   { fill:#f4f7fa; stroke:#ccd6e1; stroke-width:1; }
    .lbl  { fill:#1d2733; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:12px; font-weight:700; }
    .ico  { fill:#252d36; }
    .btn  { animation:softPulse 3.4s ease-in-out infinite; }

    @media (prefers-color-scheme:dark) {
      .bg  { fill:#27323d; stroke:#526171; }
      .lbl { fill:#e9eef3; }
      .ico { fill:#f1f5f9; }
    }

    .waveGrp { animation: gradWave 2.4s linear infinite; }
    @keyframes gradWave {
      from { transform: translateX(-126px); }
      to   { transform: translateX(126px);  }
    }
      to   { transform: translateX(280px);  }
    }

    @keyframes softPulse {
      0%,100% { transform:scale(1); }
      50%     { transform:scale(1.007); }
    }

    @media (prefers-reduced-motion:reduce) {
    }
  </style>

  <g class="btn">
    <rect class="bg" x=".5" y=".5" width="139" height="39" rx="7"/>

    <g clip-path="url(#ghClip)">
      <g class="waveGrp">
        <rect x="-70" y="-20" width="280" height="80"
              fill="url(#ghWave)" transform="skewX(-25)"/>
      </g>
    </g>

    <!-- GitHub icon: 20×20 at x=12, y=10 -->
    <g transform="translate(12,10)">
      <path class="ico" d="M10 .83A9.79 9.79 0 0 0 6.92 19.8c.49.09.67-.21.67-.47v-1.65c-2.72.59-3.3-1.16-3.3-1.16-.44-1.13-1.08-1.43-1.08-1.43-.88-.61.07-.6.07-.6.97.07 1.48 1 1.48 1 .87 1.49 2.32 1.06 2.89.81.09-.63.34-1.06.62-1.31-2.17-.25-4.45-1.08-4.45-4.75 0-1.05.37-1.91 1.01-2.59-.1-.25-.44-1.23.1-2.57 0 0 .82-.26 2.68 1.01a9.25 9.25 0 0 1 4.88 0c1.86-1.27 2.68-1.01 2.68-1.01.54 1.34.2 2.32.1 2.57.63.68 1.01 1.54 1.01 2.59 0 3.68-2.29 4.5-4.47 4.75.35.3.66.88.66 1.78v2.63c0 .26.18.57.68.47A9.79 9.79 0 0 0 10 .83Z"/>
    </g>

    <text class="lbl" x="39" y="25">GitHub</text>
  </g>
</svg>
