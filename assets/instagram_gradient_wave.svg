<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="Instagram"
     preserveAspectRatio="xMidYMid meet">
  <title>Instagram</title>
  <defs>
    <!--
      Sequential Gradient Wave (5 of 5 in sequence):
        • Order: LinkedIn (0%-20%) -> GitHub (20%-40%) -> LeetCode (40%-60%) -> Kaggle (60%-80%) -> Instagram (80%-100%)
        • Instagram starts immediately at 80% right when Kaggle finishes.
        • At 100%, Instagram finishes and cycle seamlessly loops back to LinkedIn (0%).
    -->
    <linearGradient id="igWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#E1306C" stop-opacity="0"/>
      <stop offset=".37"  stop-color="#E1306C" stop-opacity="0"/>
      <stop offset=".48"  stop-color="#E1306C" stop-opacity=".32"/>
      <stop offset=".59"  stop-color="#E1306C" stop-opacity="0"/>
      <stop offset="1"    stop-color="#E1306C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="igClip">
      <rect x=".5" y=".5" width="139" height="39" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .bg   { fill:#f4f7fa; stroke:#ccd6e1; stroke-width:1; }
    .lbl  { fill:#1d2733; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:12px; font-weight:700; }
    .ico  { fill:none; stroke:#E1306C; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .dot  { fill:#E1306C; }

    @media (prefers-color-scheme:dark) {
      .bg  { fill:#27323d; stroke:#526171; }
      .lbl { fill:#e9eef3; }
      .ico { stroke:#ff4f86; }
      .dot { fill:#ff4f86; }
    }

    /* ── 5 of 5: Active 80% to 100% (6.4s to 8.0s) ── */
    .waveGrp {
      animation: gradWave 8s linear infinite;
    }
    @keyframes gradWave {
      0%, 79.999% {
        transform: translateX(-130px);
        opacity: 0;
      }
      80% {
        transform: translateX(-130px);
        opacity: 1;
      }
      100% {
        transform: translateX(130px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .waveGrp { animation: none; }
    }
  </style>

  <g class="btn">
    <rect class="bg" x=".5" y=".5" width="139" height="39" rx="7"/>

    <g clip-path="url(#igClip)">
      <!-- 280×80 element, skewX(-25) ≈ 115deg, sweeps ±130px -->
      <g class="waveGrp">
        <rect x="-70" y="-20" width="280" height="80"
              fill="url(#igWave)" transform="skewX(-25)"/>
      </g>
    </g>

    <!-- Instagram icon: 20×20 at x=12, y=10 -->
    <g transform="translate(12,10)">
      <rect class="ico" x="1.5" y="1.5" width="17" height="17" rx="4.5"/>
      <circle class="ico" cx="10" cy="10" r="4.2"/>
      <circle class="dot" cx="14.6" cy="5.4" r="1.1"/>
    </g>

    <text class="lbl" x="39" y="25">Instagram</text>
  </g>
</svg>
